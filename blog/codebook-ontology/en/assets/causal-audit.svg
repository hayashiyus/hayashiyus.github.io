<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">Causal audit design</title><desc id="d">A fixed physical subject branches to target-preserving and source-copy edits, then to held-out tests and controls.</desc><style>text{font-family:Georgia,serif;fill:#343b68}.small{font:21px system-ui,sans-serif;fill:#6b6870}.node{fill:#f8f4ec;stroke:#b8ac9e;stroke-width:2}.line{stroke:#b5523d;stroke-width:3;fill:none}.dash{stroke:#77718c;stroke-width:2;stroke-dasharray:8 7;fill:none}</style><rect width="1200" height="470" fill="#f5f0e7"/><rect class="node" x="45" y="165" width="215" height="110" rx="8"/><text x="70" y="208" font-size="27">Fixed physical</text><text x="70" y="242" font-size="27">subject</text><path class="line" d="M260 220h110m-14-12 14 12-14 12"/><rect class="node" x="370" y="75" width="300" height="110" rx="8"/><text x="400" y="115" font-size="23">Attribute edit</text><text class="small" x="400" y="151">Same object preserved?</text><path class="line" d="M670 130 760 130m-14-12 14 12-14 12"/><rect class="node" x="370" y="285" width="300" height="110" rx="8"/><text x="400" y="325" font-size="25">Source-copy</text><text class="small" x="400" y="361">representation transplant</text><path class="line" d="M670 340 760 340m-14-12 14 12-14 12"/><path class="dash" d="M370 220H315V130h55M315 220v120h55"/><rect class="node" x="760" y="75" width="375" height="320" rx="8"/><text x="795" y="120" font-size="26">Held-out evidence</text><text class="small" x="795" y="165">referent facts</text><text class="small" x="795" y="205">outcome predictions</text><text class="small" x="795" y="245">actions</text><text class="small" x="795" y="285">capability controls</text><text class="small" x="795" y="345">+ sham / matched controls</text></svg>
