<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d"><title id="t">Three evidence layers</title><desc id="d">Proved, exact, and proposed questions connected by arrows.</desc><style>text{font-family:Georgia,serif;fill:#343b68}.small{font:22px system-ui,sans-serif;fill:#6b6870}.box{fill:#f8f4ec;stroke:#b8ac9e;stroke-width:2}.arrow{stroke:#b5523d;stroke-width:3;fill:none;stroke-dasharray:8 8}</style><rect width="1200" height="380" fill="#f5f0e7"/><rect class="box" x="40" y="90" width="310" height="190" rx="8"/><rect class="box" x="445" y="90" width="310" height="190" rx="8"/><rect class="box" x="850" y="90" width="310" height="190" rx="8"/><text x="70" y="135" font-size="30">PROVED</text><text x="70" y="180" font-size="24">Code agreement</text><text class="small" x="70" y="220">not identified by</text><text class="small" x="70" y="253">specified reports</text><text x="475" y="135" font-size="30">EXACT</text><text x="475" y="180" font-size="24">finite cancellation</text><text class="small" x="475" y="220">separately constructed</text><text class="small" x="475" y="253">toy example</text><text x="880" y="135" font-size="30">PROPOSED</text><text x="880" y="180" font-size="24">open-LLM audit</text><text class="small" x="880" y="220">causal identification</text><text class="small" x="880" y="253">capability + sham controls</text><path class="arrow" d="M350 185h95m-14-12 14 12-14 12M755 185h95m-14-12 14 12-14 12"/><text class="small" x="380" y="330">question, not implication</text><text class="small" x="780" y="330">question, not implication</text></svg>
