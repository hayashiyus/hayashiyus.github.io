ia" font-size="23" font-weight="400" fill="#cb817e" text-anchor="start" letter-spacing="0">exact-gate target = 0.231</text><circle cx="175.00" cy="247.00" r="6" fill="#477fca" stroke="white" stroke-width="1"/><text x="195.00" y="254.00" font-family="Georgia" font-size="23" font-weight="400" fill="#1d3154" text-anchor="start" letter-spacing="0">constant steering</text><circle cx="455.00" cy="247.00" r="6" fill="#9795ce" stroke="white" stroke-width="1"/><text x="475.00" y="254.00" font-family="Georgia" font-size="23" font-weight="400" fill="#1d3154" text-anchor="start" letter-spacing="0">shuffled gate</text><circle cx="735.00" cy="247.00" r="6" fill="#d3a257" stroke="white" stroke-width="1"/><text x="755.00" y="254.00" font-family="Georgia" font-size="23" font-weight="400" fill="#1d3154" text-anchor="start" letter-spacing="0">random direction</text><rect x="1080" y="225" width="460" height="615" rx="16" fill="#f2f6fc"/><circle cx="1116.00" cy="269.00" r="19" fill="#477fca" stroke="#477fca" stroke-width="1"/><text x="1116.00" y="276.00" font-family="Georgia" font-size="23" font-weight="400" fill="white" text-anchor="middle" letter-spacing="0">1</text><text x="1150.00" y="277.00" font-family="Georgia" font-size="27" font-weight="700" fill="#1d3154" text-anchor="start" letter-spacing="0">What was measured</text><text x="1115.00" y="322.00" font-family="Georgia" font-size="24" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">16 calibration examples.</text><text x="1115.00" y="356.00" font-family="Georgia" font-size="24" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">Five discrete gains per arm.</text><text x="1115.00" y="390.00" font-family="Georgia" font-size="24" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">Large outlined dots show</text><text x="1115.00" y="424.00" font-family="Georgia" font-size="24" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">the selected candidates.</text><circle cx="1116.00" cy="505.00" r="19" fill="#477fca" stroke="#477fca" stroke-width="1"/><text x="1116.00" y="512.00" font-family="Georgia" font-size="23" font-weight="400" fill="white" text-anchor="middle" letter-spacing="0">2</text><text x="1150.00" y="513.00" font-family="Georgia" font-size="27" font-weight="700" fill="#1d3154" text-anchor="start" letter-spacing="0">What remains open</text><text x="1115.00" y="558.00" font-family="Georgia" font-size="23" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">Every curve crosses the target</text><text x="1115.00" y="589.00" font-family="Georgia" font-size="23" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">between tested grid points.</text><text x="1115.00" y="620.00" font-family="Georgia" font-size="23" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">A finer search may match it.</text><text x="1115.00" y="651.00" font-family="Georgia" font-size="23" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0"></text><text x="1115.00" y="682.00" font-family="Georgia" font-size="23" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">This is teacher forcing on</text><text x="1115.00" y="713.00" font-family="Georgia" font-size="23" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">constructed repetitive states,</text><text x="1115.00" y="744.00" font-family="Georgia" font-size="23" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">not a live generation test.</text><rect x="48" y="900" width="1504" height="62" rx="12" fill="#edf2fa"/><text x="800.00" y="939.00" font-family="Georgia" font-size="30" font-weight="700" fill="#1d3154" text-anchor="middle" letter-spacing="0">A failed grid match does not prove that a control is impossible.</text><text x="800.00" y="985.00" font-family="Georgia" font-size="15" font-weight="400" fill="#687b96" text-anchor="middle" letter-spacing="0">E2 calibration data • lines join measured grid values, not an interpolated causal model • both axes logarithmic</text></svg>