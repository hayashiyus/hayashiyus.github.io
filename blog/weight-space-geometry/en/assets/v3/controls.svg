<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#fff"/><text x="64.00" y="45.00" font-family="sans-serif" font-size="15" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="3">THE GEOMETRY OF WEIGHT-SPACE PROGRAMMING</text><text x="1536.00" y="45.00" font-family="sans-serif" font-size="14" font-weight="400" fill="#687b96" text-anchor="end" letter-spacing="0">04 / E2 MEASURED LIMITATION</text><text x="64.00" y="108.00" font-family="Georgia" font-size="46" font-weight="700" fill="#1d3154" text-anchor="start" letter-spacing="0">Do the controls deliver the same intervention?</text><text x="66.00" y="151.00" font-family="Georgia" font-size="23" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">A coarse gain search did not match the target. Its curves still bracket that target.</text><path d="M64.00,178.00 L1536.00,178.00" fill="none" stroke="#e0e8f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M150.00,686.86 L1000.00,686.86" fill="none" stroke="#e2e9f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="136.00" y="692.86" font-family="Georgia" font-size="18" font-weight="400" fill="#687b96" text-anchor="end" letter-spacing="0">.01</text><path d="M150.00,567.90 L1000.00,567.90" fill="none" stroke="#e2e9f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="136.00" y="573.90" font-family="Georgia" font-size="18" font-weight="400" fill="#687b96" text-anchor="end" letter-spacing="0">.1</text><path d="M150.00,448.95 L1000.00,448.95" fill="none" stroke="#e2e9f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="136.00" y="454.95" font-family="Georgia" font-size="18" font-weight="400" fill="#687b96" text-anchor="end" letter-spacing="0">1</text><path d="M150.00,330.00 L100