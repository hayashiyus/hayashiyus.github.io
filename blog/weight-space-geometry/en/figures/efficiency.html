span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.345em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mord"><span class="mord mathnormal">d</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8491em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">⊤</span></span></span></span></span></span></span></span><span class="mord mathnormal" style="margin-right:0.13889em;">F</span><span class="mord mathnormal">d</span></span></span></span>; the gold line fixes the linear effect. Its tangency with the smallest admissible ellipse gives <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>d</mi><mo>∗</mo></msub><mo>=</mo><mfrac><mrow><mi mathvariant="normal">.</mi><mn>6</mn><msup><mi>F</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mi>b</mi></mrow><mrow><msup><mi>b</mi><mi mathvariant="normal">⊤</mi></msup><msup><mi>F</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mi>b</mi></mrow></mfrac></mrow><annotation encoding="application/x-tex">d_* = \frac{.6F^{-1}b}{b^\top F^{-1}b}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8444em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">d</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1757em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mbin mtight
