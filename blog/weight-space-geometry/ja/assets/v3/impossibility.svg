<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#fff"/><text x="64.00" y="45.00" font-family="sans-serif" font-size="15" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="3">THE GEOMETRY OF WEIGHT-SPACE PROGRAMMING</text><text x="1536.00" y="45.00" font-family="sans-serif" font-size="14" font-weight="400" fill="#687b96" text-anchor="end" letter-spacing="0">08 / EXACT COUNTEREXAMPLE</text><text x="64.00" y="108.00" font-family="Georgia" font-size="46" font-weight="700" fill="#1d3154" text-anchor="start" letter-spacing="0">One shared weight cannot obey every request.</text><text x="66.00" y="151.00" font-family="Georgia" font-size="23" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">A two-input example exposes the difference between direct intervention and realizable intervention.</text><path d="M64.00,178.00 L1536.00,178.00" fill="none" stroke="#e0e8f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="80.00" y="245.00" font-family="Georgia" font-size="31" font-weight="700" fill="#1d3154" text-anchor="start" letter-spacing="0">Two inputs. One parameter.</text><text x="86.00" y="303.00" font-family="Georgia" font-size="38" font-weight="400" fill="#477fca" text-anchor="start" letter-spacing="0">h_w(x) = wx</text><rect x="65" y="355" width="560" height="158" rx="16" fill="#f1f5fc"/><text x="95.00" y="403.00" font-family="Georgia" font-size="27" font-weight="700" fill="#1d3154" text-anchor="start" letter-spacing="0">Input  x = +1</text><text x="95.00" y="459.00" font-family="Georgia" font-size="29" font-weight="400" fill="#477fca" text-anchor="start" letter-spacing="0">weight edit: Δh = +δw</text><rect x="65" y="545" width="560" height="158" rx="16" fill="#f0eff9"/><text x="95.00" y="593.00" font-family="Georgia" font-size="27" font-weight="700" fill="#1d3154" text-anchor="start" letter-spacing="0">Input  x = −1</text><text x="95.00" y="649.00" font-family="Georgia" font-size="29" font-weight="400" fill="#9795ce" text-anchor="start" letter-spacing="0">weight edit: Δh = −δw</text><text x="90.00" y="771.00" font-family="Georgia" font-size="27" font-weight="400" fill="#1d3154" text-anchor="start" letter-spacing="0">Direct steering asks for (+d, +d).</text><text x="90.00" y="816.00" font-family="Georgia" font-size="25" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">A shared scalar edit gives (δw, −δw).</text><path d="M855.00,705.00 L1445.00,705.00" fill="none" stroke="#e2e9f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="841.00" y="711.00" font-family="Georgia" font-size="18" font-weight="400" fill="#687b96" text-anchor="end" letter-spacing="0">−d</text><path d="M855.00,555.00 L1445.00,555.00" fill="none" stroke="#e2e9f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="841.00" y="561.00" font-family="Georgia" font-size="18" font-weight="400" fill="#687b96" text-anchor="end" letter-spacing="0">0</text><path d="M855.00,405.00 L1445.00,405.00" fill="none" stroke="#e2e9f3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="841.00" y="411.00" font-family="Georgia" font-size="18" font-weight="400" fill="#687b96" text-anchor="end" letter-spacing="0">+d</text><text x="953.33" y="811.00" font-family="Georgia" font-size="19" font-weight="400" fill="#687b96" text-anchor="middle" letter-spacing="0">−d</text><text x="1150.00" y="811.00" font-family="Georgia" font-size="19" font-weight="400" fill="#687b96" text-anchor="middle" letter-spacing="0">0</text><text x="1346.67" y="811.00" font-family="Georgia" font-size="19" font-weight="400" fill="#687b96" text-anchor="middle" letter-spacing="0">+d</text><path d="M855.00,330.00 L855.00,780.00" fill="none" stroke="#a6b8d0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M855.00,780.00 L1445.00,780.00" fill="none" stroke="#a6b8d0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="1150.00" y="848.00" font-family="Georgia" font-size="21" font-weight="400" fill="#687b96" text-anchor="middle" letter-spacing="0">response on input +1</text><text x="855.00" y="307.00" font-family="Georgia" font-size="21" font-weight="400" fill="#687b96" text-anchor="start" letter-spacing="0">response on input −1</text><path d="M874.67,345.00 L1425.33,765.00" fill="none" stroke="#477fca" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M1150.00,555.00 L1346.67,405.00" fill="none" stroke="#d3a257" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M1346.67,405.00 L1340.16,416.25 L1334.09,408.30 Z" fill="#d3a257" stroke="#d3a257" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><circle cx="1346.67" cy="405.00" r="10" fill="#d3a257" stroke="#1d3154" stroke-width="1"/><text x="1341.67" y="381.00" font-family="Georgia" font-size="23" font-weight="400" fill="#1d3154" text-anchor="middle" letter-spacing="0">desired (+d, +d)</text><text x="970.00" y="880.00" font-family="Georgia" font-size="25" font-weight="400" fill="#477fca" text-anchor="start" letter-spacing="0">reachable line: u₂ = −u₁</text><rect x="48" y="900" width="1504" height="62" rx="12" fill="#edf2fa"/><text x="800.00" y="939.00" font-family="Georgia" font-size="30" font-weight="700" fill="#1d3154" text-anchor="middle" letter-spacing="0">For d ≠ 0, no δw can equal d and −d at once.</text><text x="800.00" y="985.00" font-family="Georgia" font-size="15" font-weight="400" fill="#687b96" text-anchor="middle" letter-spacing="0">Exact scalar model • allowing an editable bias or another path changes the reachable set • no claim that all neural edits are scalar</text></svg>