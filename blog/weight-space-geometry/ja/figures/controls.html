<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="data:," rel="icon"/><base href="../"/><title>図の拡大表示 · 巨大な機械の、小さなスイッチ</title><link href="site.css?v=f1e44996433e" rel="stylesheet"/><link href="vendor/katex/katex.min.css" rel="stylesheet"/></head><body class="figure-viewer"><div aria-hidden="true" class="progress"><i></i></div><header class="masthead"><span class="eyebrow">図の拡大表示</span><nav><a href="index.html#figure-controls">本文へ戻る ↩</a></nav></header><main class="viewer"><a class="back-to-article" href="index.html#figure-controls">← 本文へ戻る</a><figure class="figure viewer-figure" id="figure-controls"><div class="figure-art"><img alt="三つのゲイン応答曲線が、測定したゲインの間で目標線を横切る。右の小図は、目標を挟む二つの測定点と、その間に残る探索の隙間を示す。" class="static-frame" height="1000" loading="lazy" src="assets/v24/measurements/controls.png?v=83a67cb35108" width="1600"/></div><figcaption><span class="label">対照実験 · 測定結果</span><p class="caption-takeaway">三つの対照条件とも目標効果をまたぐが、選んだゲインでは一致していない。人工的な系列を与えたこの比較では効果を揃えられず、ゲートが必要かどうかは判断できない。</p><details class="caption-details"><summary>設定・適用範囲・元ファイル</summary><div class="caption-settings">本プロジェクトのE2。較正用の16例で、五つのゲインを試した。線は測定値を結び、大きな輪郭付きの点は選択した候補を示す。今回試したゲインでは、三つの条件すべてが事前に定めた効果一致基準を満たさなかった。各曲線は目標値を挟んでおり、右の小図は、その区間の両端にある測定点を取り出したもの。追加の測定や一致するゲインを示すものではなく、小図では、それぞれ別の範囲を持つ対数の縦軸を使っている。人工的に構成した系列をteacher forcingで与える試験である。</div><div class="caption-downloads"> <a class="source-original" download="" href="assets/v24/measurements/controls.png?v=83a67cb35108">原画像 ↧</a></div></details></figcaption></figure></main><script src="site.js?v=f1e44996433e"></script></body></html>
