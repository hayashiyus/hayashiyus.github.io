<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="data:," rel="icon"/><base href="../"/><title>図の拡大表示 · 巨大な機械の、小さなスイッチ</title><link href="site.css?v=97dfceee1c78" rel="stylesheet"/><link href="vendor/katex/katex.min.css" rel="stylesheet"/></head><body class="figure-viewer"><div aria-hidden="true" class="progress"><i></i></div><header class="masthead"><span class="eyebrow">図の拡大表示</span><nav><a href="index.html#figure-reconstruction">本文へ戻る ↩</a></nav></header><main class="viewer"><a class="back-to-article" href="index.html#figure-reconstruction">← 本文へ戻る</a><figure class="figure viewer-figure" id="figure-reconstruction"><div class="figure-art"><img alt="原著のMATH-500正答率と、FP32・BF16の残差を示す別々の対数グラフ。課題性能と数値再構成の確認を分けて描く。" class="static-frame" height="1000" loading="lazy" src="assets/v24/measurements/reconstruction.png?v=411e67b64e7c" width="1600"/></div><figcaption><span class="label">編集の再構成 · 測定結果</span><p class="caption-takeaway">左は原著が報告した成績の改善。右のE1は、40個の固定prefixで重み編集と活性化への介入の数値的一致を調べた実験であり、ベンチマーク全体の再現ではない。</p><details class="caption-details"><summary>設定・適用範囲・元ファイル</summary><div class="caption-settings">左は原著者らが報告したMATH-500の正答率、右は本プロジェクトのE1で行った数値再構成である。40個の固定prefixについて、重み編集と加法的な活性化フックを比較した。ロジットとKL（単位はnat）には、それぞれ別の対数軸を用いている。ベンチマーク全体を新たに再現した結果ではない。</div><div class="caption-downloads"> <a class="source-original" download="" href="assets/v24/measurements/reconstruction.png?v=411e67b64e7c">原画像 ↧</a></div></details></figcaption></figure></main><script src="site.js?v=97dfceee1c78"></script></body></html>
