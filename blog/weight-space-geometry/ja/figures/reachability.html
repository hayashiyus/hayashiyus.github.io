<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="data:," rel="icon"/><base href="../"/><title>図の拡大表示 · 巨大な機械の、小さなスイッチ</title><link href="site.css?v=d0d6e6778920" rel="stylesheet"/><link href="vendor/katex/katex.min.css" rel="stylesheet"/></head><body class="figure-viewer"><div aria-hidden="true" class="progress"><i></i></div><header class="masthead"><span class="eyebrow">図の拡大表示</span><nav><a href="index.html#figure-reachability">本文へ戻る ↩</a></nav></header><main class="viewer"><a class="back-to-article" href="index.html#figure-reachability">← 本文へ戻る</a><figure class="figure viewer-figure" data-animation="assets/v20/geometry/reachability.gif?v=85f7e15cf2cc" data-autoplay="true" data-motion="" data-static="assets/v20/geometry/reachability.png?v=9b4a0de46686" data-video="assets/v20/geometry/reachability.mp4?v=f83bbdab7f2d" id="figure-reachability"><div class="figure-art"><img alt="対応する二枚の半透明な面。上の青い8本の矢印は要求された変化、下の紫色の8本は一つの共有行列が生む変化を示す。面内の金色の隙間は実現できない残差である。" class="static-frame" height="1000" loading="lazy" src="assets/v20/geometry/reachability.png?v=9b4a0de46686" width="1600"/><video aria-label="図のアニメーション" autoplay="" class="motion-video" height="1000" hidden="" loop="" muted="" playsinline="" poster="assets/v20/geometry/reachability.png?v=9b4a0de46686" preload="auto" width="1600"><source src="assets/v20/geometry/reachability.mp4?v=f83bbdab7f2d" type="video/mp4"/></video></div><figcaption><span class="label">実現可能性 · 厳密な数学モデル</span>8入力からなる厳密な例。<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>F</mi><mo>=</mo><mi>I</mi></mrow><annotation encoding="application/x-tex">F=I</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.13889em;">F</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.07847em;">I</span></span></span></span>。下側の矢印はすべて同じ行列 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><mi>W</mi></mrow><annotation encoding="application/x-tex">\Delta W</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord">Δ</span><span class="mord mathnormal" style="margin-right:0.13889em;">W</span></span></span></span> を使い、アニメーションではその行列をゼロから解 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><msup><mi>W</mi><mo>∗</mo></msup><mo>=</mo><mi>V</mi><msup><mi>A</mi><mo>+</mo></msup><mo>=</mo><mi mathvariant="normal">diag</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi mathvariant="normal">.</mi><mn>35</mn><mo separator="true">,</mo><mi mathvariant="normal">.</mi><mn>55</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\Delta W^*=VA^+=\operatorname{diag}(.35,.55)</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.6887em;"></span><span class="mord">Δ</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.13889em;">W</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6887em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mbin mtight">∗</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7713em;"></span><span class="mord mathnormal" style="margin-right:0.22222em;">V</span><span class="mord"><span class="mord mathnormal">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7713em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mbin mtight">+</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop"><span class="mord mathrm" style="margin-right:0.01389em;">diag</span></span><span class="mopen">(</span><span class="mord">.35</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">.55</span><span class="mclose">)</span></span></span></span> まで徐々に変える。金色の残差の大きさは、要求された場のノルムの65.6%である。中立色の線は対応する入力を結び、二枚の面の上下の隔たりは残差に含めない。これは解析的な補間であり、Astraの探索過程でも、Qwenで測定した場でもない。 <a class="source-original" download="" href="assets/v20/geometry/reachability.png?v=9b4a0de46686">原画像 ↧</a> <a class="gif-download" download="" href="assets/v20/geometry/reachability.gif?v=85f7e15cf2cc">GIF ↧</a> <a class="video-alternative" download="" href="assets/v20/geometry/reachability.mp4?v=f83bbdab7f2d">MP4 ↧</a></figcaption><div class="motion"><button aria-pressed="false" type="button">アニメーションを停止</button><span>自動再生 · 動きを減らす設定では静止画を表示</span></div></figure></main><script src="site.js?v=d0d6e6778920"></script></body></html>
