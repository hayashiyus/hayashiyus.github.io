<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="data:," rel="icon"/><base href="../"/><title>図の拡大表示 · 巨大な機械の、小さなスイッチ</title><link href="site.css?v=f1e44996433e" rel="stylesheet"/><link href="vendor/katex/katex.min.css" rel="stylesheet"/></head><body class="figure-viewer"><div aria-hidden="true" class="progress"><i></i></div><header class="masthead"><span class="eyebrow">図の拡大表示</span><nav><a href="index.html#figure-reachability">本文へ戻る ↩</a></nav></header><main class="viewer"><a class="back-to-article" href="index.html#figure-reachability">← 本文へ戻る</a><figure class="figure viewer-figure" data-animation="assets/v24/constraints/reachability.gif?v=a92505f45fd0" data-motion="" data-scroll-motion="once" data-static="assets/v24/constraints/reachability.png?v=17038b1899ce" data-video="assets/v24/constraints/reachability.mp4?v=a0a9f9617a9f" id="figure-reachability"><div class="figure-art"><img alt="一つの座標図に八つの入力を配置。青い要求矢印は固定され、一つの行列が紫の矢印をまとめて動かす。計算した最適解でも金色の残差が残る。" class="static-frame" height="1000" loading="lazy" src="assets/v24/constraints/reachability.png?v=17038b1899ce" width="1600"/><video aria-label="図のアニメーション" class="motion-video" height="1000" hidden="" muted="" playsinline="" poster="assets/v24/constraints/reachability.png?v=17038b1899ce" preload="none" width="1600"><source src="assets/v24/constraints/reachability.mp4?v=a0a9f9617a9f" type="video/mp4"/></video></div><figcaption><span class="label">実現可能性 · 厳密な数学モデル</span><p class="caption-takeaway">8個の入力への要求を、一つの行列で満たそうとする。この数学例では最もよく当てはめても残差が残る。共有行列では、各入力を独立に動かせないためだ。</p><details class="caption-details"><summary>設定・適用範囲・元ファイル</summary><div class="caption-settings">8入力からなる厳密な例で、<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>F</mi><mo>=</mo><mi>I</mi></mrow><annotation encoding="application/x-tex">F=I</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.13889em;">F</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.07847em;">I</span></span></span></span>。青は要求する変化、紫は一つの共有行列が生む変化を示す。アニメーションでは、その行列をゼロから <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">Δ</mi><msup><mi>W</mi><mo>∗</mo></msup><mo>=</mo><mi>V</mi><msup><mi>A</mi><mo>+</mo></msup><mo>=</mo><mi mathvariant="normal">diag</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi mathvariant="normal">.</mi><mn>35</mn><mo separator="true">,</mo><mi mathvariant="normal">.</mi><mn>55</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\Delta W^*=VA^+=\operatorname{diag}(.35,.55)</annotation></semantics></math></span><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:0.6887em;"></span><span class="mord">Δ</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.13889em;">W</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6887em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mbin mtight">∗</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7713em;"></span><span class="mord mathnormal" style="margin-right:0.22222em;">V</span><span class="mord"><span class="mord mathnormal">A</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7713em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mbin mtight">+</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop"><span class="mord mathrm" style="margin-right:0.01389em;">diag</span></span><span class="mopen">(</span><span class="mord">.35</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">.55</span><span class="mclose">)</span></span></span></span> まで徐々に変える。金色の線分は、同じ図の中で、実現した端点と要求した端点を結ぶ。各変位には共通の表示倍率を用いている。解に到達しても、残差のノルムは要求した場のノルムの65.6%に相当する。これは解析的な補間であり、Astraの探索やQwenで測定した場ではない。</div><div class="caption-downloads"> <a class="source-original" download="" href="assets/v24/constraints/reachability.png?v=17038b1899ce">原画像 ↧</a> <a class="gif-download" download="" href="assets/v24/constraints/reachability.gif?v=a92505f45fd0">GIF ↧</a> <a class="video-alternative" download="" href="assets/v24/constraints/reachability.mp4?v=a0a9f9617a9f">MP4 ↧</a></div></details></figcaption><div class="motion"><button aria-pressed="false" type="button">アニメーションを再生</button><span>図が見えたら一度だけ自動再生 · いつでも停止できます</span></div></figure></main><script src="site.js?v=f1e44996433e"></script></body></html>
